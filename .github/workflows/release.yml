name: Build Signed Release APK

# Manual trigger only — this workflow never runs automatically on push/PR.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name to embed in the APK file name"
        required: false
        default: "1.0.0"

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/solo-ledger-release.p12
          echo "Keystore decoded ($(wc -c < keystore/solo-ledger-release.p12) bytes)."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: keystore/solo-ledger-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/Solo-Ledger-v${{ github.event.inputs.version_name }}-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solo-Ledger-v${{ github.event.inputs.version_name }}-release
          path: app/build/outputs/apk/release/Solo-Ledger-v${{ github.event.inputs.version_name }}-release.apk
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -f keystore/solo-ledger-release.p12
