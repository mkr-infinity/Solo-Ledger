name: Android Debug APK

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build Signed Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate temporary debug signing key
        shell: bash
        run: |
          SIGNING_DIR="$RUNNER_TEMP/solo-ledger-signing"
          SIGNING_KEYSTORE_PATH="$SIGNING_DIR/solo-ledger-debug.jks"
          SIGNING_STORE_PASSWORD="solo-ledger-ci-store-pass"
          SIGNING_KEY_ALIAS="solo-ledger-debug"
          SIGNING_KEY_PASSWORD="solo-ledger-ci-key-pass"

          mkdir -p "$SIGNING_DIR"
          keytool -genkeypair \
            -v \
            -keystore "$SIGNING_KEYSTORE_PATH" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -keypass "$SIGNING_KEY_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 7 \
            -dname "CN=Solo Ledger CI, OU=CI, O=Solo Ledger, L=CI, S=CI, C=US"

          {
            printf 'SIGNING_KEYSTORE_PATH=%s\n' "$SIGNING_KEYSTORE_PATH"
            printf 'SIGNING_STORE_PASSWORD=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'SIGNING_KEY_ALIAS=%s\n' "$SIGNING_KEY_ALIAS"
            printf 'SIGNING_KEY_PASSWORD=%s\n' "$SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: solo-ledger-signed-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
