name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEMP_KEYSTORE: ${{ github.workspace }}/temp-debug-keystore.jks
      TEMP_KEY_ALIAS: solo-ledger-debug
      TEMP_KEY_PASSWORD: temp-debug-123456

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle (to generate wrapper JAR)
        run: |
          GRADLE_VERSION=8.10.2
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-install
          GRADLE_BIN="/tmp/gradle-install/gradle-${GRADLE_VERSION}/bin/gradle"
          chmod +x "$GRADLE_BIN"
          # Generate the wrapper JAR into the project
          "$GRADLE_BIN" wrapper --gradle-version "$GRADLE_VERSION" --project-dir .
          echo "Wrapper JAR generated:"
          ls -la gradle/wrapper/gradle-wrapper.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Generate Temporary Debug Keystore
        run: |
          keytool -genkeypair \
            -alias "$TEMP_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -keystore "$TEMP_KEYSTORE" \
            -storepass "$TEMP_KEY_PASSWORD" \
            -keypass "$TEMP_KEY_PASSWORD" \
            -dname "CN=Solo Ledger Debug,O=GitHub Actions,C=IN" \
            -noprompt
          echo "Keystore generated:"
          ls -la "$TEMP_KEYSTORE"

      - name: Build Signed Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          STORE_FILE: ${{ env.TEMP_KEYSTORE }}
          STORE_PASSWORD: ${{ env.TEMP_KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.TEMP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.TEMP_KEY_PASSWORD }}

      - name: Verify Debug APK Signature
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Verify APK
        run: |
          echo "APK output:"
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Solo-Ledger-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
