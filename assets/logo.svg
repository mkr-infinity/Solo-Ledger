<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Adaptive icon safe zone: content within 72x72 centered (18,18 to 90,90) -->

  <!-- Wallet body -->
  <rect x="18" y="36" width="72" height="48" rx="10" fill="#6C63FF"/>

  <!-- Wallet flap (top curve) -->
  <path d="M28,36 Q54,14 80,36 Z" fill="#8B84FF"/>

  <!-- Card slot highlight -->
  <rect x="28" y="52" width="32" height="6" rx="3" fill="#FFFFFF" opacity="0.25"/>

  <!-- Coin / clasp circle -->
  <circle cx="76" cy="60" r="9" fill="#FFD700"/>
  <circle cx="76" cy="60" r="5.5" fill="#FFAA00"/>

  <!-- Subtle shine on wallet -->
  <rect x="18" y="36" width="72" height="8" rx="10" fill="#FFFFFF" opacity="0.12"/>
</svg>
